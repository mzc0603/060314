<body>
    <div class="container">

        </div>
        <div class="content">
            <div class="tab-content active" id="draw">
                <div class="result" id="drawResult">点击开始</div>
                <div class="input-group">

                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startCall()">开始点名</button>

                    <label><input type="checkbox" id="noRepeat"> 不重复</label>

                </div>

    <script>
        let drawInterval, callInterval, numberInterval;
        let drawHistory = [];
        let callHistory = [];
        let numberHistory = [];
        let usedNumbers = new Set();

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        function getList(textareaId) {
            const text = document.getElementById(textareaId).value;
            return text.split('\n').map(item => item.trim()).filter(item => item.length > 0);
        }

        function startDraw() {
            const list = getList('drawList');
            if (list.length === 0) {
                alert('请先输入抽签名单！');
                return;
            }
            const resultEl = document.getElementById('drawResult');
            resultEl.classList.add('animating');
            drawInterval = setInterval(() => {
                resultEl.textContent = list[Math.floor(Math.random() * list.length)];
            }, 50);
        }

        function stopDraw() {
            if (drawInterval) {
                clearInterval(drawInterval);
                drawInterval = null;
                const resultEl = document.getElementById('drawResult');
                resultEl.classList.remove('animating');
                if (resultEl.textContent !== '点击开始') {
                    drawHistory.unshift(resultEl.textContent);
                    if (drawHistory.length > 10) drawHistory.pop();
                    updateHistory('drawHistory', drawHistory);
                }
            }
        }

        function resetDraw() {
            stopDraw();
            document.getElementById('drawResult').textContent = '点击开始';
            drawHistory = [];
            updateHistory('drawHistory', drawHistory);
        }

        function startCall() {
            const list = getList('callList');
            if (list.length === 0) {
                alert('请先输入点名名单！');
                return;
            }
            const resultEl = document.getElementById('callResult');
            resultEl.classList.add('animating');
            callInterval = setInterval(() => {
                resultEl.textContent = list[Math.floor(Math.random() * list.length)];
            }, 50);
        }

        function stopCall() {
            if (callInterval) {
                clearInterval(callInterval);
                callInterval = null;
                const resultEl = document.getElementById('callResult');
                resultEl.classList.remove('animating');
                if (resultEl.textContent !== '点击开始') {
                    callHistory.unshift(resultEl.textContent);
                    if (callHistory.length > 10) callHistory.pop();
                    updateHistory('callHistory', callHistory);
                }
            }
        }

        function resetCall() {
            stopCall();
            document.getElementById('callResult').textContent = '点击开始';
            callHistory = [];
            updateHistory('callHistory', callHistory);
        }

        function startNumber() {
            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const count = parseInt(document.getElementById('numCount').value);
            const noRepeat = document.getElementById('noRepeat').checked;

            if (min > max) {
                alert('最小值不能大于最大值！');
                return;
            }

            if (noRepeat && (max - min + 1) < count) {
                alert('范围内数字不足以生成指定数量的不重复数字！');
                return;
            }

            const resultEl = document.getElementById('numberResult');
            resultEl.classList.add('animating');

            numberInterval = setInterval(() => {
                const nums = [];
                const tempUsed = new Set();
                for (let i = 0; i < count; i++) {
                    let num;
                    do {
                        num = Math.floor(Math.random() * (max - min + 1)) + min;
                    } while (noRepeat && tempUsed.has(num));
                    if (noRepeat) tempUsed.add(num);
                    nums.push(num);
                }
                resultEl.textContent = nums.join(', ');
            }, 50);
        }

        function stopNumber() {
            if (numberInterval) {
                clearInterval(numberInterval);
                numberInterval = null;
                const resultEl = document.getElementById('numberResult');
                resultEl.classList.remove('animating');
                if (resultEl.textContent !== '点击开始') {
                    numberHistory.unshift(resultEl.textContent);
                    if (numberHistory.length > 10) numberHistory.pop();
                    updateHistory('numberHistory', numberHistory);
                }
            }
        }

        function resetNumber() {
            stopNumber();
            document.getElementById('numberResult').textContent = '点击开始';
            numberHistory = [];
            usedNumbers.clear();
            updateHistory('numberHistory', numberHistory);
        }

        function startGroup() {
            const list = getList('groupList');
            const groupCount = parseInt(document.getElementById('groupCount').value);

            if (list.length === 0) {
                alert('请先输入分组名单！');
                return;
            }

            if (groupCount < 1) {
                alert('分组数量至少为1！');
                return;
            }

            const shuffled = [...list].sort(() => Math.random() - 0.5);
            const groups = Array.from({ length: groupCount }, () => []);

            shuffled.forEach((item, index) => {
                groups[index % groupCount].push(item);
            });

            const resultEl = document.getElementById('groupResult');
            resultEl.textContent = '分组完成！';

            const resultsEl = document.getElementById('groupResults');
            resultsEl.innerHTML = '';
            groups.forEach((group, index) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.innerHTML = `
                    <div class="group-title">第${index + 1}组</div>
                    <div class="group-members">${group.join('<br>')}</div>
                `;
                resultsEl.appendChild(card);
            });
        }

        function resetGroup() {
            document.getElementById('groupResult').textContent = '点击开始';
            document.getElementById('groupResults').innerHTML = '';
        }

        function updateHistory(elId, history) {
            const el = document.getElementById(elId);
            el.innerHTML = history.map(item => `<span class="history-item">${item}</span>`).join('');
        }
    </script>
